[project]
name = "mm-grpo"
version = "0.1.0"
description = "REINFORCE and GRPO reinforcement learning algorithms"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "mm-model",
    "mm-viz",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mm_grpo"]

[tool.uv.sources]
mm-model = { workspace = true }
mm-viz = { workspace = true }
