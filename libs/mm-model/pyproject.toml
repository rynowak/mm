[project]
name = "mm-model"
version = "0.1.0"
description = "GPT model definition, config, and checkpointing"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "mm-tokenizers",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mm_model"]

[tool.uv.sources]
mm-tokenizers = { workspace = true }
