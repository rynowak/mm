[project]
name = "mm-wordle"
version = "0.1.0"
description = "Wordle game environment, word lists, and reward function"
requires-python = ">=3.12"
dependencies = [
    "mm-tokenizers",
    "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mm_wordle"]
include = ["src/mm_wordle/data/*.txt"]

[tool.uv.sources]
mm-tokenizers = { workspace = true }
