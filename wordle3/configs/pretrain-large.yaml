# ~10M baseline (8L / 8H / 320d). Shake out the pipeline; compare against xxl.
model:
  n_layers: 8
  n_heads: 8
  embed_dim: 320
  context_len: 128
  dropout: 0.1

training:
  seed: 42
  batch_size: 512
  learning_rate: 3e-4
  weight_decay: 0.1
  warmup_steps: 200
  max_steps: 15000
  grad_clip: 1.0
  eval_interval: 1000
  checkpoint_interval: 5000
  amp: true
  compile: true
  step_metrics_interval: 1
  win_rate_interval: 50
  step_eval_games: 16
  eval_games: 256
