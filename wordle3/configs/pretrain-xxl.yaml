# ~38M primary (12L / 8H / 512d) for the 14,855-word lexicon. Compare against large.
model:
  n_layers: 12
  n_heads: 8
  embed_dim: 512
  context_len: 128
  dropout: 0.1

training:
  seed: 42
  batch_size: 512
  learning_rate: 3e-4
  weight_decay: 0.1
  warmup_steps: 300
  max_steps: 20000
  grad_clip: 1.0
  eval_interval: 1000
  checkpoint_interval: 5000
  amp: true
  compile: true
  step_metrics_interval: 1
  win_rate_interval: 50
  step_eval_games: 16
  eval_games: 256
