model:
  n_layers: 8
  n_heads: 8
  embed_dim: 320
  context_len: 128
  dropout: 0.1

training:
  seed: 42
  batch_size: 64
  learning_rate: 1e-4
  weight_decay: 0.1
  warmup_steps: 500
  max_steps: 200000
  grad_clip: 1.0
  eval_interval: 5000
  checkpoint_interval: 10000

data:
  transcript_games: 100000
  val_fraction: 0.05
