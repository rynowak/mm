[project]
name = "mm"
version = "0.1.0"
description = "ML training playground — pre-training and reinforcement learning exercises"
requires-python = ">=3.12"
dependencies = [
    "datasets>=3.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "mm-tokenizers",
    "mm-model",
    "mm-training",
    "mm-grpo",
    "mm-wordle",
    "mm-tetris",
    "mm-viz",
    "fastapi>=0.136.3",
    "uvicorn>=0.48.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.30",
    "websockets>=16.0",
    # bufo sample: Stable Diffusion LoRA fine-tuning
    "accelerate>=0.34",
    "diffusers>=0.30",
    "huggingface-hub>=0.25",
    "peft>=0.12",
    "pillow>=10.0",
    "safetensors>=0.4",
    "transformers>=4.44",
]

[tool.uv.sources]
mm-tokenizers = { workspace = true }
mm-model = { workspace = true }
mm-training = { workspace = true }
mm-grpo = { workspace = true }
mm-wordle = { workspace = true }
mm-tetris = { workspace = true }
mm-viz = { workspace = true }

[tool.uv.workspace]
members = [
    "libs/mm-tokenizers",
    "libs/mm-model",
    "libs/mm-training",
    "libs/mm-grpo",
    "libs/mm-wordle",
    "libs/mm-tetris",
    "libs/mm-viz",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
    "ty>=0.0.42",
    "vermin>=1.8",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]
# UP017 rewrites timezone.utc -> datetime.UTC (py3.11+), but the Ray cluster runs
# py3.9; keep the portable timezone.utc form.
ignore = ["UP017"]

[tool.pytest.ini_options]
testpaths = ["libs", "wordle/tests", "wordle2/tests", "wordle3/tests", "tetris/tests", "bufo/tests"]

# diffusers/transformers ship lazy-import "dummy" fallback objects and no usable
# type information, so every model/scheduler/pipeline/tokenizer resolves to a
# `real | dummy` union that `ty` can neither call nor pass as an argument. The
# torch `Dataset.__getitem__` generic override trips ty too. These are
# third-party-stub limitations, not real type errors, so we scope the suppressed
# rules to the bufo diffusion glue only — the rest of the repo stays strict.
[[tool.ty.overrides]]
include = ["bufo/**/*.py"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
call-non-callable = "ignore"
invalid-argument-type = "ignore"
invalid-method-override = "ignore"
invalid-assignment = "ignore"
# qwen_vl_utils is an optional, cluster-only dep imported under try/except
# ImportError in vlm_judge.py; it isn't in the local env, so ty can't resolve it.
unresolved-import = "ignore"
