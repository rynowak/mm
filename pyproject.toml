[project]
name = "mm"
version = "0.1.0"
description = "ML training playground — pre-training and reinforcement learning exercises"
requires-python = ">=3.12"
dependencies = [
    "datasets>=3.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "mm-tokenizers",
    "mm-model",
    "mm-training",
    "mm-grpo",
    "mm-wordle",
    "mm-viz",
    "fastapi>=0.136.3",
    "uvicorn>=0.48.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.30",
]

[tool.uv.sources]
mm-tokenizers = { workspace = true }
mm-model = { workspace = true }
mm-training = { workspace = true }
mm-grpo = { workspace = true }
mm-wordle = { workspace = true }
mm-viz = { workspace = true }

[tool.uv.workspace]
members = [
    "libs/mm-tokenizers",
    "libs/mm-model",
    "libs/mm-training",
    "libs/mm-grpo",
    "libs/mm-wordle",
    "libs/mm-viz",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]

[tool.pytest.ini_options]
testpaths = ["libs", "wordle/tests"]
