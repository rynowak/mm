[project]
name = "mm"
version = "0.1.0"
description = "ML training playground — pre-training and reinforcement learning exercises"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "libs/mm-tokenizers",
    "libs/mm-model",
    "libs/mm-training",
    "libs/mm-grpo",
    "libs/mm-wordle",
    "libs/mm-viz",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]

[tool.pytest.ini_options]
testpaths = ["libs"]
