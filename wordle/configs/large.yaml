model:
  n_layers: 16
  n_heads: 8
  embed_dim: 512
  context_len: 256
  dropout: 0.1

training:
  seed: 42
  batch_size: 64
  learning_rate: 1e-4
  weight_decay: 0.1
  warmup_steps: 200
  max_steps: 15000
  grad_clip: 1.0
  eval_interval: 500
  checkpoint_interval: 1000

data:
  transcript_games: 50000
  val_fraction: 0.05
