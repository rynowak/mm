model:
  n_layers: 6
  n_heads: 8
  embed_dim: 256
  context_len: 256
  dropout: 0.1

training:
  seed: 42
  batch_size: 64
  learning_rate: 3e-4
  weight_decay: 0.1
  warmup_steps: 200
  max_steps: 50000
  grad_clip: 1.0
  eval_interval: 2500
  checkpoint_interval: 5000

data:
  transcript_games: 50000
  val_fraction: 0.05
