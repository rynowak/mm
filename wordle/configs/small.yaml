model:
  n_layers: 6
  n_heads: 8
  embed_dim: 256
  context_len: 256
  dropout: 0.1

training:
  seed: 42
  batch_size: 64
  learning_rate: 3e-4
  weight_decay: 0.1
  warmup_steps: 100
  max_steps: 5000
  grad_clip: 1.0
  eval_interval: 500
  checkpoint_interval: 1000

data:
  word_list_repeats: 10
  transcript_games: 20000
  val_fraction: 0.05
