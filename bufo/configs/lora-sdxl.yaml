# Bufo kitchen-sink v3: SDXL base + UNet & text-encoder LoRA, new caption schema.
# The big quality lever. Slow on MPS (768px fp32) — a full run is hours.
# Iterate fast with stabilityai/sdxl-turbo as base_model; final run on base-1.0.
data:
  resolution: 768          # SDXL sweet spot on MPS (1024 is ~2x slower)
  random_flip: true

lora:
  rank: 32
  alpha: 32
  dropout: 0.0
  target_modules: ["to_q", "to_k", "to_v", "to_out.0"]
  train_text_encoder: true
  text_target_modules: ["q_proj", "k_proj", "v_proj", "out_proj"]

training:
  seed: 42
  base_kind: sdxl
  base_model: stabilityai/stable-diffusion-xl-base-1.0
  batch_size: 1
  grad_accum: 4
  learning_rate: 5.0e-5     # SDXL likes a lower LR than SD1.5
  weight_decay: 1.0e-2
  warmup_steps: 50
  max_steps: 600
  grad_clip: 1.0
  amp: true
  snapshot_interval: 300
  checkpoint_interval: 300
  num_workers: 0
  snapshot_prompts:
    - "bufo riding a skateboard, flat cartoon frog emoji sticker, bold simple shapes, white background"
    - "bufo as a ninja, flat cartoon frog emoji sticker, bold simple shapes, white background"
    - "bufo drinking coffee, flat cartoon frog emoji sticker, bold simple shapes, white background"
    - "bufo crying, flat cartoon frog emoji sticker, bold simple shapes, white background"
