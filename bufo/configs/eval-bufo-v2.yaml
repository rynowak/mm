# Eval set for v2 models trained on the new caption schema. Same held-out
# subjects as eval-bufo.yaml; prompt_template + suffix match the v2 captions so
# the benchmark tracks each model's training format.
concept_text: "a bufo, a green cartoon frog sticker"
prompt_template: "bufo {subject}"
suffix: ", flat cartoon frog emoji sticker, bold simple shapes, white background"
clip_model: "laion/CLIP-ViT-B-32-laion2B-s34B-b79K"
clipscore_w: 2.5
seed: 20260610
images_per_prompt: 4
num_inference_steps: 30
guidance_scale: 7.5
negative_prompt: "photo, realistic, 3d render, cluttered, tiny, text, watermark"

prompts:
  - "riding a skateboard"
  - "offering a flower"
  - "as a ninja"
  - "drinking bubble tea"
  - "wearing a tiny crown"
  - "playing the violin"
  - "as an astronaut floating in space"
  - "holding a balloon"
  - "riding a bicycle"
  - "as a chef cooking"
  - "doing yoga"
  - "wearing headphones"
  - "as a knight with a sword"
  - "eating a taco"
  - "as a vampire"
  - "surfing a wave"
  - "painting at an easel"
  - "as a scientist with a beaker"
  - "wrapped in a blanket"
  - "as a pirate captain"
  - "blowing bubbles"
  - "as a wizard casting a spell"
  - "playing chess"
  - "as a firefighter"

step_prompts:
  - "riding a skateboard"
  - "as a ninja"
  - "offering a flower"
  - "as an astronaut floating in space"
